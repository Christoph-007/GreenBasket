name: greenbasket
description: GreenBasket Mini — Premium grocery e-commerce Flutter application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.3
  retrofit: ^4.1.0
  json_annotation: ^4.9.0
  connectivity_plus: ^6.0.3

  # Navigation
  go_router: ^14.2.0

  # Dependency Injection
  get_it: ^7.6.9
  injectable: ^2.4.1

  # Local Storage
  hive_flutter: ^2.0.0
  flutter_secure_storage: ^9.2.2

  # UI & Design
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10
  lottie: ^3.1.2
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.1.0
  flutter_staggered_grid_view: ^0.7.0
  pinput: ^5.0.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4

  # Payments
  razorpay_flutter: ^1.3.7

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  flutter_rating_bar: ^4.0.1
  pull_to_refresh_flutter3: ^2.0.2

  # Freezed annotations
  freezed_annotation: ^2.4.1

  # RxDart for debounce
  rxdart: ^0.27.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.3
  network_image_mock: ^2.1.1
  build_runner: ^2.4.11
  retrofit_generator: ^8.1.2
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.1
  freezed: ^2.5.2
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/placeholders/
    - assets/images/onboarding/
    - assets/images/empty_states/
    - assets/icons/
    - assets/icons/payment/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
